# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
# Maintain dependencies for GitHub Actions
- package-ecosystem: "github-actions"
  groups:
    actions-deps:
      patterns:
      - "*"
  directory: "/"
  schedule:
    interval: "weekly"
  # Hold a new release back for a week before proposing it, so a compromised or broken
  # version has time to be noticed and yanked before it lands here.
  cooldown:
    default-days: 7
# Maintain dependencies for every Go module: the root, each adapter under errors/,
# and proptest/. The glob finds a new module without an edit here. Each directory gets
# its own grouped pull request, since each module resolves its own versions.
- package-ecosystem: "gomod"
  directories:
  - "/"
  - "/**/*"
  groups:
    go-deps:
      patterns:
      - "*"
  # Every module builds against this repository's toerr through a replace, and
  # bin/release.sh sets the version the adapters require, so a bump of it here would
  # only fight the release.
  ignore:
  - dependency-name: "github.com/StevenACoffman/toerr"
  schedule:
    interval: "weekly"
  # Hold a new release back for a week before proposing it, so a compromised or broken
  # version has time to be noticed and yanked before it lands here.
  cooldown:
    default-days: 7
