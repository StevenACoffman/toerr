name: Mutation testing
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GOTOOLCHAIN: local
jobs:
  mutate:
    name: Mutate changed lines
    runs-on: ubuntu-latest
    # Changed lines only, so usually a few minutes, but a pull request that rewrites a
    # package mutates most of it: internal/trace alone is about 300 mutants, run one at a
    # time. This is a ceiling against a mutant that makes the suite hang, not a
    # performance target.
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # --git-diff-lines needs the base revision to diff against.
        fetch-depth: 0
        # The diff base is already local after a full fetch; nothing talks to the remote.
        persist-credentials: "false"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: "1.27"
    - name: Install mutago
      run: go install github.com/quality-gates/mutago/v2/cmd/mutago@latest
    - name: Mutate the lines this pull request changed
      # Scoped to changed lines because mutating the whole module runs the suite once per
      # mutant, which is minutes of CI for a result nobody reads on an unrelated change.
      #
      # No --min-msi: a score floor needs a baseline this repository does not have yet, and a
      # gate that fails on arrival gets switched off rather than fixed. --logger-github
      # annotates surviving mutants on the diff instead, which is the part worth reading —
      # each one is a line the suite runs without checking. Add a floor once the escape set
      # has been looked at.
      #
      # bin/mutate.sh runs each mutant against every package and the properties, with
      # -race, rather than only the mutated package's own tests.
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        bin/mutate.sh --git-diff-lines \
          --git-diff-base="${BASE_SHA}" \
          --logger-github --quiet --no-diffs
