# Release workflow: on a pushed vX.Y.Z tag, goreleaser builds the source tarball,
# one SBOM per module (syft), and a checksum, then cosign signs the checksum
# keylessly and a build-provenance attestation is recorded. This is a library, so
# there are no binaries or images — only the signed, attested source + SBOMs.
#
# One release covers every module. bin/release.sh pushes the root tag and each
# module's errors/<name>/vX.Y.Z tag in one atomic push, at the same commit. Only the
# root tag matches the trigger below, so the module tags start no run of their own.
name: release
# run only on tags
on:
  push:
    tags:
    - "v*"
permissions:
  contents: write # create the GitHub release and upload assets
  id-token: write # keyless cosign signing (OIDC)
  attestations: write # build-provenance attestation
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0 # this is important, otherwise it won't checkout the full tree (i.e. no previous tags)
        # goreleaser publishes with GITHUB_TOKEN through the API, not git push, so the
        # token need not stay behind in .git/config.
        persist-credentials: "false"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        # A release must not build from a cache that an earlier, less trusted run (a pull
        # request) could have written.
        cache: "false"
    # The release notes tell consumers to `go get` every module at this version, so
    # every module's tag must exist and point at the commit being released. HEAD is
    # that commit: checkout resolved the tag, annotated or not.
    - name: Check every module is tagged at this commit
      run: |
        status=0
        commit=$(git rev-parse HEAD)
        for gomod in $(git ls-files -- ':(glob)errors/**/go.mod'); do
          tag="$(dirname "${gomod}")/${GITHUB_REF_NAME}"
          if [ "$(git rev-parse -q --verify "refs/tags/${tag}^{commit}")" != "${commit}" ]; then
            echo "::error::${tag} is missing or does not point at ${commit}; tag with bin/release.sh"
            status=1
          fi
        done
        exit "${status}"
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
    - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The module tags point at this commit too. .goreleaser.yaml ignores them,
        # and naming the tag that started the run makes the choice explicit.
        GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-checksums: ./dist/checksums.txt
